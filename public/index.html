<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3b1478" />
  <title>Ka-tok</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/fonts/baloo/index.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/landing.css" />
</head>
<body class="landing">
  <main class="landing-main">
    <h1 class="logo huge pop-in">Ka<span>-</span>tok</h1>
    <p class="tagline slide-up">Đố vui · Đua ngựa · Ai nhanh hơn?</p>
    <div class="landing-horses"><span data-horse="0"></span><span data-horse="5"></span><span data-horse="10"></span></div>
    <div class="choices">
      <a class="choice player slide-up" href="/play">
        <span class="choice-icon">📱</span>
        <span class="choice-title">Người chơi</span>
        <span class="choice-sub">Vào chơi bằng điện thoại</span>
      </a>
      <a class="choice host slide-up" href="/host">
        <span class="choice-icon">📺</span>
        <span class="choice-title">Host</span>
        <span class="choice-sub">Điều khiển & chiếu màn hình lớn</span>
      </a>
    </div>
  </main>
  <script type="module" src="/js/landing.js"></script>
</body>
</html>

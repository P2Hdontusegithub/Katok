<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#3b1478" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Ka-tok · Người chơi</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/fonts/baloo/index.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/player.css" />
</head>
<body class="player">
  <section id="join" class="center-screen">
    <div id="join-card" class="card join-card pop-in">
      <h1 class="logo">Ka<span>-</span>tok</h1>
      <form id="join-form">
        <input id="name" maxlength="20" placeholder="Tên của bạn" autocomplete="nickname" enterkeyhint="go" />
        <button class="btn big" type="submit">Vào chơi!</button>
      </form>
      <div id="join-error" class="error-text"></div>
    </div>
  </section>

  <section id="game" hidden>
    <header class="ptop">
      <span id="me-horse" class="me-horse"></span>
      <span id="me-name" class="me-name"></span>
      <span class="me-score"><span id="me-score">0</span> <small>điểm</small></span>
    </header>
    <main id="screen" class="screen"></main>
  </section>
  <script type="module" src="/js/player.js"></script>
</body>
</html>
